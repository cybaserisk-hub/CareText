[build]
  publish = "review-dist"
  command = "node scripts/deployment-disabled.mjs"

# No consent endpoints are approved for public access. Never auto-discover functions.
[functions]
  directory = "deployment/no-functions"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
