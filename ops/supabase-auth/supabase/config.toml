project_id = "CareText"

# Deliberately scoped: do not overwrite unrelated hosted database, storage or MFA settings.
[auth]
site_url = "http://localhost:4173"
additional_redirect_urls = ["http://localhost:4173/account.html"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.sms]
enable_signup = false
enable_confirmations = false
