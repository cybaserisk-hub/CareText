project_id = "CareText"

# Deliberately scoped: do not overwrite unrelated hosted database, storage or MFA settings.
[auth]
site_url = "https://caretext.app"
additional_redirect_urls = ["https://caretext.app/account.html", "http://localhost:4173/account.html"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(CARETEXT_RESEND_AUTH_KEY)"
admin_email = "notifications@caretext.app"
sender_name = "CareText"

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/private/before_user_created"
